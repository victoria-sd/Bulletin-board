{% extends 'flatpages/default.html' %}

{% block title %}
Login
{% endblock title %}

{% block content %}

<form method="post" action="{% url 'login' %}">
{% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="login">
    <input type="hidden" name="next" value="{{ next }}">
</form>

<p>
    Если у вас еще нет аккаунта, пройдите регистрацию по <a href="{% url 'signup' %}">ссылке</a>.
</p>

{% endblock %}
