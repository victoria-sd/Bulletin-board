{% extends 'flatpages/default.html' %}

{% block title %}
Delete response
{% endblock title %}

{% block content %}
  <h1>Удалить отклик</h1>
  <p>Вы уверены, что хотите удалить отклик:</p>
  <p>"{{ response.text }}"</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit">Удалить</button>
    <a href="{% url 'response' %}">Отмена</a>
  </form>
{% endblock %}
